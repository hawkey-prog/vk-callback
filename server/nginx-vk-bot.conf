# /etc/nginx/sites-available/vk-bot
# Мини-приложение ходит сюда из браузера, поэтому сертификат обязан быть
# настоящим: с самоподписанным запрос молча упадёт, curl -k это скрывает.

server {
    listen 80;
    server_name 89-108-78-99.sslip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 89-108-78-99.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/89-108-78-99.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/89-108-78-99.sslip.io/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }
}
