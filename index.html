<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Модерация сообществ</title>
<style>
  :root {
    --bg: #f0f2f5; --card: #fff; --text: #000; --muted: #818c99;
    --line: #e7e8ec; --blue: #2688eb; --red: #e64646; --green: #4bb34b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#19191a; --card:#232324; --text:#e1e3e6; --muted:#76787a; --line:#2f3033; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0 auto; padding: 12px; max-width: 720px;
    background: var(--bg); color: var(--text); font-size: 15px;
  }
  .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  button {
    background: var(--blue); color: #fff; border: 0; border-radius: 8px;
    padding: 11px 16px; font-size: 15px; cursor: pointer; margin: 0 6px 6px 0;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.sec { background: var(--line); color: var(--text); }
  button.danger { background: var(--red); }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 15px; margin-bottom: 8px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .muted { color: var(--muted); font-size: 13px; }
  .ok { color: var(--green); } .err { color: var(--red); }
  pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; font-size: 12px; overflow-x: auto; white-space: pre-wrap;
    word-break: break-all; margin: 8px 0 0; max-height: 220px; overflow-y: auto;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: var(--green); } .dot.off { background: var(--muted); }
  .dot.bad { background: var(--red); }
  .item {
    border-top: 1px solid var(--line); padding: 10px 0;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .item .who { flex: 1; min-width: 160px; }
  .item a { color: var(--blue); text-decoration: none; }
  .item button { margin: 0; padding: 8px 12px; font-size: 14px; }
  .big { font-size: 17px; font-weight: 600; }
</style>
</head>
<body>

<div class="card">
  <h2>1. Настройки</h2>
  <label>Адрес сервера</label>
  <input id="serverUrl" placeholder="https://89-108-78-99.sslip.io">
  <label>Ключ доступа (ADMIN_SECRET из .env на сервере)</label>
  <input id="adminSecret" type="password" placeholder="секрет с сервера">
  <button id="btnSave" class="sec">Сохранить</button>
  <span id="saveState" class="muted"></span>
</div>

<div class="card">
  <h2>2. Авторизация VK ID</h2>
  <div id="authState" class="muted">—</div>
  <div style="margin-top:12px">
    <button id="btnAuth">Войти через VK ID</button>
    <button id="btnStatus" class="sec">Проверить состояние</button>
    <button id="btnRefresh" class="sec">Обновить токен</button>
  </div>
  <div id="authInfo"></div>
</div>

<div class="card">
  <h2>3. Сообщества</h2>
  <button id="btnGroups" class="sec">Загрузить список</button>
  <label style="margin-top:8px">Управляемые сообщества</label>
  <select id="groupSelect"><option value="">— сначала авторизуйтесь —</option></select>
  <label>или ID вручную</label>
  <input id="groupManual" placeholder="239099649" inputmode="numeric">
</div>

<div class="card">
  <h2>4. Проверка</h2>
  <label>ID пользователя</label>
  <input id="userId" placeholder="277162801" inputmode="numeric">
  <div class="row">
    <button id="btnRemove" class="danger">Удалить</button>
    <button id="btnBan" class="danger">Заблокировать</button>
  </div>
  <div id="manualResult"></div>
</div>

<div class="card">
  <h2>5. Очередь</h2>
  <p class="muted" style="margin-top:0">
    Задания, которые сервер принял от бота, но не смог выполнить сам.
    В норме этот список пуст.
  </p>
  <button id="btnLoadList" class="sec">Обновить список</button>
  <div id="listState" class="muted" style="margin-top:8px">—</div>
  <div id="list"></div>
</div>

<div class="card">
  <h2>Журнал</h2>
  <pre id="log">—</pre>
</div>

<script>
(function () {
  'use strict';

  var CLIENT_ID = '54634256';
  var REDIRECT_URI = 'https://hawkey-prog.github.io/vk-callback/index.html';
  var VK_AUTH_URL = 'https://id.vk.ru/authorize';
  var DEFAULT_SERVER = 'https://89-108-78-99.sslip.io';

  // Доступы, выданные приложению индивидуально, всё равно нужно запросить
  // на шаге авторизации — иначе VK вернёт только vkid.personal_info.
  var SCOPE = 'groups';

  var $ = function (id) { return document.getElementById(id); };

  function log(msg, cls) {
    var el = $('log');
    var line = '[' + new Date().toTimeString().slice(0, 8) + '] ' + msg;
    if (el.textContent === '—') el.textContent = '';
    el.textContent = line + '\n' + el.textContent;
    if (el.textContent.length > 12000) el.textContent = el.textContent.slice(0, 12000);
    if (cls === 'err') console.error(line); else console.log(line);
  }

  function fatal(what) {
    log(what, 'err');
    $('authState').innerHTML = '<span class="dot bad"></span>' + escapeHtml(what);
  }
  window.onerror = function (msg, src, line) {
    fatal('сбой скрипта: ' + msg + ' (строка ' + line + ')');
    return false;
  };
  window.addEventListener('unhandledrejection', function (ev) {
    fatal('сбой: ' + (ev.reason && ev.reason.message ? ev.reason.message : ev.reason));
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  // --- Связь с сервером ---

  function serverBase() { return ($('serverUrl').value.trim() || DEFAULT_SERVER).replace(/\/+$/, ''); }

  function serverFetch(path, options) {
    var opts = options || {};
    opts.headers = opts.headers || {};
    opts.headers['Content-Type'] = 'application/json';
    var secret = $('adminSecret').value.trim();
    if (secret) opts.headers['X-Admin-Secret'] = secret;
    return fetch(serverBase() + path, opts).then(function (res) {
      return res.json().then(function (body) {
        if (!res.ok) {
          var msg = body.error;
          if (msg && typeof msg === 'object') msg = msg.error_msg || JSON.stringify(msg);
          throw new Error(msg || ('HTTP ' + res.status));
        }
        return body;
      }, function () { throw new Error('сервер вернул не JSON, HTTP ' + res.status); });
    });
  }

  $('btnSave').onclick = function () {
    lsSet('vkmod_server', $('serverUrl').value.trim());
    lsSet('vkmod_secret', $('adminSecret').value.trim());
    $('saveState').textContent = 'сохранено';
    setTimeout(function () { $('saveState').textContent = ''; }, 2000);
  };

  // --- PKCE ---

  function randomString(length) {
    var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
    var out = '', bytes = new Uint8Array(length);
    crypto.getRandomValues(bytes);
    for (var i = 0; i < length; i++) out += chars[bytes[i] % chars.length];
    return out;
  }

  function codeChallenge(verifier) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier))
      .then(function (buf) {
        var bin = String.fromCharCode.apply(null, new Uint8Array(buf));
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      });
  }

  $('btnAuth').onclick = function () {
    var verifier = randomString(64);
    var state = randomString(43);
    lsSet('vk_code_verifier', verifier);
    lsSet('vk_state', state);
    codeChallenge(verifier).then(function (challenge) {
      var url = VK_AUTH_URL +
        '?response_type=code' +
        '&client_id=' + CLIENT_ID +
        '&redirect_uri=' + encodeURIComponent(REDIRECT_URI) +
        '&state=' + state +
        '&code_challenge=' + challenge +
        '&code_challenge_method=S256' +
        '&scope=' + encodeURIComponent(SCOPE) +
        // Без этого VK может молча переиспользовать прежнее согласие,
        // выданное до того, как приложению открыли доступ к groups.
        '&prompt=consent';
      window.location.href = url;
    });
  };

  // --- Возврат с формы согласия ---

  function showGrant(r) {
    var scope = r.scope || '(пусто)';
    if (r.has_groups) {
      $('authState').innerHTML = '<span class="dot on"></span><span class="big ok">' +
        'Право groups получено</span>';
      $('authInfo').innerHTML =
        '<p class="muted">scope: <code>' + escapeHtml(scope) + '</code><br>' +
        'user_id: ' + escapeHtml(r.user_id || '?') +
        ' · refresh-токен: ' + (r.has_refresh ? 'есть' : 'НЕТ') +
        ' · вызовы с сервера: ' + (r.server_side_ok ? 'проходят' : 'не проходят') + '</p>';
    } else {
      $('authState').innerHTML = '<span class="dot bad"></span><span class="big err">' +
        'groups не выдан</span>';
      $('authInfo').innerHTML =
        '<p class="err">VK вернул только: <code>' + escapeHtml(scope) + '</code></p>' +
        '<p class="muted">Значит, доступ приложению 54634256 ещё не активирован ' +
        'либо форма согласия не показала это право. Пришлите эту строку в поддержку.</p>';
    }
    log('scope от VK: ' + scope);
  }

  function handleCallback() {
    var params = new URLSearchParams(window.location.search);

    if (params.get('error')) {
      fatal('VK отказал: ' + params.get('error') + ' — ' +
            (params.get('error_description') || ''));
      return;
    }

    var code = params.get('code');
    if (!code) {
      $('authState').innerHTML = '<span class="dot off"></span>не авторизовано';
      loadStatus();
      return;
    }

    var verifier = lsGet('vk_code_verifier');
    var savedState = lsGet('vk_state');
    if (!verifier) {
      fatal('нет code_verifier: авторизация начата в другом браузере или в режиме ' +
            'инкогнито. Откройте страницу заново и нажмите «Войти через VK ID».');
      return;
    }
    if (params.get('state') && savedState && params.get('state') !== savedState) {
      fatal('параметр state не совпал — возможна подмена запроса');
      return;
    }
    lsSet('vk_code_verifier', '');
    lsSet('vk_state', '');

    $('authState').innerHTML = 'Меняю код на токен…';
    serverFetch('/vk/exchange-code', {
      method: 'POST',
      body: JSON.stringify({
        code: code,
        code_verifier: verifier,
        device_id: params.get('device_id') || '',
        state: params.get('state') || savedState
      })
    })
      .then(function (r) {
        // Код одноразовый: оставлять его в адресе нельзя, обновление страницы
        // приведёт к попытке обменять уже использованный код.
        history.replaceState({}, '', window.location.pathname);
        showGrant(r);
        loadGroups();
      })
      .catch(function (e) {
        fatal('обмен кода не удался: ' + e.message);
      });
  }

  // --- Состояние ---

  function loadStatus() {
    return serverFetch('/vk/status')
      .then(function (r) {
        if (!r.has_token) {
          $('authState').innerHTML = '<span class="dot off"></span>токена нет, войдите через VK ID';
          return;
        }
        showGrant({
          scope: r.scope, has_groups: r.has_groups, user_id: r.user_id,
          has_refresh: r.has_refresh, server_side_ok: r.server_side_ok
        });
        if (!r.token_alive) {
          $('authInfo').innerHTML += '<p class="muted">Токен просрочен — ' +
            'сервер обновит его сам при первом задании.</p>';
        }
      })
      .catch(function (e) {
        $('authState').innerHTML = '<span class="dot bad"></span>' + escapeHtml(e.message);
      });
  }

  $('btnStatus').onclick = loadStatus;

  $('btnRefresh').onclick = function () {
    $('authInfo').innerHTML = '<p class="muted">Обновляю…</p>';
    serverFetch('/vk/refresh', { method: 'POST' })
      .then(function (r) { showGrant(r); log('токен обновлён'); })
      .catch(function (e) { $('authInfo').innerHTML = '<p class="err">' + escapeHtml(e.message) + '</p>'; });
  };

  // --- Сообщества ---

  function loadGroups() {
    return serverFetch('/vk/groups')
      .then(function (r) {
        var sel = $('groupSelect');
        sel.innerHTML = '';
        if (!r.groups.length) {
          sel.innerHTML = '<option value="">— вы нигде не администратор —</option>';
          return;
        }
        r.groups.forEach(function (g) {
          var o = document.createElement('option');
          o.value = g.id;
          o.textContent = g.name + ' (' + g.id + ')';
          sel.appendChild(o);
        });
        var saved = lsGet('vkmod_group');
        if (saved) sel.value = saved;
        log('сообществ под управлением: ' + r.groups.length);
      })
      .catch(function (e) { log('список сообществ: ' + e.message, 'err'); });
  }

  $('btnGroups').onclick = loadGroups;
  $('groupSelect').onchange = function () { lsSet('vkmod_group', this.value); };

  function currentGroupId() {
    return $('groupManual').value.trim() || $('groupSelect').value;
  }

  // --- Проверка ---

  function moderate(action) {
    var group = currentGroupId(), user = $('userId').value.trim();
    var box = $('manualResult');
    if (!user) { box.innerHTML = '<p class="err">Укажите ID пользователя</p>'; return; }
    box.innerHTML = '<p class="muted">Выполняю…</p>';
    serverFetch(action === 'ban' ? '/vk/ban-user' : '/vk/remove-user', {
      method: 'POST',
      body: JSON.stringify({ user_id: user, group_id: group })
    })
      .then(function (r) {
        if (r.status === 'queued') {
          box.innerHTML = '<p class="err">Сервер не смог выполнить сам и поставил в очередь: ' +
            escapeHtml(r.reason || '') + '</p>';
        } else {
          box.innerHTML = '<p class="ok">Готово, ответ VK: ' + escapeHtml(JSON.stringify(r.response)) + '</p>';
        }
        log(action + ' ' + user + ' → ' + (r.status || 'ok'));
      })
      .catch(function (e) {
        box.innerHTML = '<p class="err">' + escapeHtml(e.message) + '</p>';
        log(action + ' ' + user + ' — ' + e.message, 'err');
      });
  }

  $('btnRemove').onclick = function () { moderate('remove'); };
  $('btnBan').onclick = function () { moderate('ban'); };

  // --- Очередь ---

  var listTasks = [];

  function renderList() {
    var box = $('list');
    if (!listTasks.length) { box.innerHTML = '<p class="muted">Очередь пуста.</p>'; return; }
    box.innerHTML = listTasks.map(function (t) {
      var what = t.action === 'ban' ? 'заблокировать' : 'удалить';
      var when = t.created ? new Date(t.created * 1000).toLocaleString('ru-RU') : '';
      return '<div class="item"><div class="who">' +
        '<a href="https://vk.com/id' + encodeURIComponent(t.user_id) + '" target="_blank" ' +
        'rel="noopener">id' + escapeHtml(t.user_id) + '</a>' +
        '<div class="muted">' + escapeHtml([what, t.reason, when].filter(Boolean).join(' · ')) +
        '</div></div>' +
        '<button data-done="' + t.id + '">Сделано</button>' +
        '<button class="sec" data-skip="' + t.id + '">Пропустить</button></div>';
    }).join('');
  }

  function loadList() {
    $('listState').textContent = 'Загружаю…';
    return serverFetch('/vk/queue/list?limit=200')
      .then(function (r) {
        listTasks = r.tasks || [];
        $('listState').textContent = 'В очереди: ' + r.total;
        renderList();
      })
      .catch(function (e) {
        $('listState').innerHTML = '<span class="err">' + escapeHtml(e.message) + '</span>';
      });
  }

  $('btnLoadList').onclick = loadList;

  $('list').onclick = function (ev) {
    var el = ev.target;
    var done = el.getAttribute && el.getAttribute('data-done');
    var skip = el.getAttribute && el.getAttribute('data-skip');
    var id = done || skip;
    if (!id) return;
    el.disabled = true;
    serverFetch('/vk/queue/ack', {
      method: 'POST',
      body: JSON.stringify({ id: id, ok: !!done, error: done ? '' : 'пропущено вручную' })
    })
      .then(function () {
        listTasks = listTasks.filter(function (t) { return t.id !== id; });
        $('listState').textContent = 'В очереди: ' + listTasks.length;
        renderList();
        log((done ? 'отмечено сделанным: ' : 'пропущено: ') + id);
      })
      .catch(function (e) { el.disabled = false; log('отметка: ' + e.message, 'err'); });
  };

  // --- Старт ---

  $('serverUrl').value = lsGet('vkmod_server') || DEFAULT_SERVER;
  $('adminSecret').value = lsGet('vkmod_secret');
  handleCallback();
})();
</script>
</body>
</html>
