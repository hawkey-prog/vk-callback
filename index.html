<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Модератор сообщества</title>
<style>
  :root {
    --bg: #f0f2f5; --card: #fff; --text: #000; --muted: #818c99;
    --line: #e7e8ec; --blue: #2688eb; --red: #e64646; --green: #4bb34b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#19191a; --card:#232324; --text:#e1e3e6; --muted:#76787a; --line:#2f3033; }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 12px; background: var(--bg); color: var(--text); font-size: 15px;
  }
  .card {
    background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  h2 { font-size: 16px; margin: 0 0 12px; }
  button {
    background: var(--blue); color: #fff; border: 0; border-radius: 8px;
    padding: 11px 16px; font-size: 15px; cursor: pointer; margin: 0 6px 6px 0;
  }
  button:disabled { opacity: .45; cursor: default; }
  button.sec { background: var(--line); color: var(--text); }
  button.danger { background: var(--red); }
  input, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 15px; margin-bottom: 8px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  .muted { color: var(--muted); font-size: 13px; }
  .ok { color: var(--green); }
  .err { color: var(--red); }
  pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; font-size: 12px; overflow-x: auto; white-space: pre-wrap;
    word-break: break-all; margin: 8px 0 0; max-height: 240px; overflow-y: auto;
  }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .dot.on { background: var(--green); } .dot.off { background: var(--muted); }
  .dot.bad { background: var(--red); }
  details { margin-top: 8px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>

<div class="card">
  <h2>1. Доступ</h2>
  <div id="authState" class="muted">Инициализация…</div>
  <div id="diag" class="muted" style="margin-top:6px"></div>
  <div style="margin-top:12px">
    <button id="btnAuth">Выдать права groups</button>
    <button id="btnCheck" class="sec" disabled>Проверить токен</button>
  </div>
  <div id="authInfo"></div>
</div>

<div class="card">
  <h2>2. Сообщество</h2>
  <label>Управляемые сообщества</label>
  <select id="groupSelect"><option value="">— сначала выдайте права —</option></select>
  <label>или ID вручную</label>
  <input id="groupManual" placeholder="236838246" inputmode="numeric">
</div>

<div class="card">
  <h2>3. Ручная проверка</h2>
  <label>ID пользователя</label>
  <input id="userId" placeholder="277162801" inputmode="numeric">
  <div class="row">
    <button id="btnRemove" class="danger" disabled>Удалить</button>
    <button id="btnBan" class="danger" disabled>Заблокировать</button>
  </div>
  <div id="manualResult"></div>
</div>

<div class="card">
  <h2>4. Связь с сервером</h2>
  <label>Адрес сервера</label>
  <input id="serverUrl" placeholder="https://89-108-78-99.sslip.io">
  <label>Ключ доступа (ADMIN_SECRET с сервера)</label>
  <input id="adminSecret" type="password" placeholder="секрет из .env">
  <button id="btnPush" class="sec">Сохранить и отправить токен</button>
  <div id="serverState" class="muted" style="margin-top:8px">—</div>
</div>

<div class="card">
  <h2>5. Обработка очереди</h2>
  <p class="muted" style="margin-top:0">
    Пока эта вкладка открыта, приложение забирает задания с сервера и выполняет их.
    Токен обновляется автоматически. Закроете вкладку — очередь просто копится.
  </p>
  <button id="btnWorker" disabled>Запустить обработку</button>
  <div id="workerState" class="muted"><span class="dot off"></span>остановлена</div>
  <pre id="log">—</pre>
</div>

<!-- Библиотека лежит рядом, а не на CDN: внешний хост может быть недоступен,
     и тогда страница молча переставала работать. -->
<script src="vk-bridge.js"></script>
<script>
(function () {
  'use strict';

  // ID мини-приложения. Возьмите его из адреса vk.com/app<ID> и подставьте сюда.
  var APP_ID = 54720386;

  var API_VERSION = '5.199';
  var SCOPE = 'groups';
  // Пауза между вызовами VK API: лимит для токена пользователя — 3 запроса в секунду.
  var API_DELAY_MS = 400;
  var QUEUE_POLL_MS = 10000;
  // Токен живёт час; обновляем заранее, чтобы обработка не спотыкалась.
  var TOKEN_REFRESH_MS = 45 * 60 * 1000;

  var bridge = window.vkBridge;
  var token = null;
  var tokenExpires = 0;
  var workerTimer = null;
  var refreshTimer = null;

  var $ = function (id) { return document.getElementById(id); };

  function log(msg, cls) {
    var el = $('log');
    var time = new Date().toTimeString().slice(0, 8);
    var line = '[' + time + '] ' + msg;
    if (el.textContent === '—') el.textContent = '';
    el.textContent = line + '\n' + el.textContent;
    if (el.textContent.length > 12000) el.textContent = el.textContent.slice(0, 12000);
    if (cls === 'err') console.error(line); else console.log(line);
  }

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  // В iframe VK доступ к хранилищу может быть закрыт, а обращение к нему —
  // выбросить исключение и убить весь скрипт. Поэтому только через обёртки.
  function lsGet(key) {
    try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
  }
  function lsSet(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* приватный режим */ }
  }

  function describeBridgeError(e) {
    if (!e) return 'неизвестная ошибка';
    if (e instanceof Error) return e.message;
    var d = e.error_data || e;
    if (d.error_reason && d.error_reason.error_msg) {
      return 'VK API ' + d.error_reason.error_code + ': ' + d.error_reason.error_msg;
    }
    if (typeof d.error_reason === 'string') return d.error_reason;
    return d.error_msg || d.error_description || JSON.stringify(d);
  }

  // Любой необработанный сбой должен быть виден на экране: раньше такая ошибка
  // просто гасила обработчик, и кнопка выглядела нерабочей.
  function fatal(what) {
    log(what, 'err');
    $('authState').innerHTML = '<span class="dot bad"></span>' + what;
  }
  window.onerror = function (msg, src, line) {
    fatal('сбой скрипта: ' + msg + ' (строка ' + line + ')');
    return false;
  };
  window.addEventListener('unhandledrejection', function (ev) {
    fatal('сбой: ' + describeBridgeError(ev.reason));
  });

  // --- VK API через мост: так запрос уходит из клиента VK и CORS не мешает ---
  function callApi(method, params) {
    var p = {};
    for (var k in params) if (params.hasOwnProperty(k)) p[k] = params[k];
    p.access_token = token;
    p.v = API_VERSION;
    return bridge.send('VKWebAppCallAPIMethod', { method: method, params: p })
      .then(function (r) { return r.response; });
  }

  // --- Шаг 1: права ---

  function requestToken(silent) {
    if (!bridge) {
      return Promise.reject(new Error(
        'vk-bridge не загрузился — обновите страницу (Ctrl+F5)'));
    }
    if (!APP_ID) {
      return Promise.reject(new Error('APP_ID не задан в index.html'));
    }
    if (typeof bridge.isEmbedded === 'function' && !bridge.isEmbedded()) {
      return Promise.reject(new Error(
        'страница открыта вне VK — права выдаются только на vk.com/app' + APP_ID));
    }
    return bridge.send('VKWebAppGetAuthToken', { app_id: APP_ID, scope: SCOPE })
      .then(function (r) {
        // VK возвращает только реально выданные права — проверяем, что groups среди них.
        var granted = (r.scope || '').split(',').map(function (s) { return s.trim(); });
        if (granted.indexOf('groups') === -1) {
          throw new Error('VK не выдал право groups. Выдано: "' + (r.scope || 'ничего') + '"');
        }
        token = r.access_token;
        // expires приходит в секундах; 0 означает «без ограничения срока».
        tokenExpires = r.expires ? r.expires * 1000 : 0;
        if (!silent) log('Токен получен, scope: ' + r.scope);
        renderAuth();
        return r;
      });
  }

  function renderAuth() {
    var st = $('authState');
    if (!token) {
      st.innerHTML = '<span class="dot off"></span>прав нет';
    } else {
      var until = tokenExpires
        ? 'до ' + new Date(tokenExpires).toTimeString().slice(0, 5)
        : 'без срока';
      st.innerHTML = '<span class="dot on"></span>токен есть (' + until + ')';
    }
    var has = !!token;
    $('btnCheck').disabled = !has;
    $('btnRemove').disabled = !has;
    $('btnBan').disabled = !has;
    $('btnWorker').disabled = !has;
  }

  $('btnAuth').onclick = function () {
    $('authInfo').innerHTML = '';
    requestToken(false)
      .then(loadGroups)
      .catch(function (e) {
        $('authInfo').innerHTML = '<p class="err">' + describeBridgeError(e) + '</p>';
        log('Ошибка выдачи прав: ' + describeBridgeError(e), 'err');
      });
  };

  $('btnCheck').onclick = function () {
    callApi('groups.get', { filter: 'admin', extended: 1, count: 100 })
      .then(function (r) {
        $('authInfo').innerHTML =
          '<p class="ok">Токен рабочий. Сообществ под управлением: ' + r.count + '</p>';
      })
      .catch(function (e) {
        $('authInfo').innerHTML = '<p class="err">' + describeBridgeError(e) + '</p>';
      });
  };

  // --- Шаг 2: сообщества ---

  function loadGroups() {
    return callApi('groups.get', { filter: 'admin', extended: 1, count: 100 })
      .then(function (r) {
        var sel = $('groupSelect');
        sel.innerHTML = '';
        if (!r.items.length) {
          sel.innerHTML = '<option value="">— вы нигде не администратор —</option>';
          return;
        }
        r.items.forEach(function (g) {
          var o = document.createElement('option');
          o.value = g.id;
          o.textContent = g.name + ' (' + g.id + ')';
          sel.appendChild(o);
        });
        var saved = lsGet('vkmod_group');
        if (saved) sel.value = saved;
        log('Загружено сообществ: ' + r.items.length);
      })
      .catch(function (e) { log('groups.get: ' + describeBridgeError(e), 'err'); });
  }

  $('groupSelect').onchange = function () {
    lsSet('vkmod_group', this.value);
  };

  function currentGroupId() {
    var manual = $('groupManual').value.trim();
    if (manual) return manual;
    return $('groupSelect').value;
  }

  // --- Шаг 3: ручная проверка ---

  function moderate(action, groupId, userId) {
    if (action === 'ban') {
      return callApi('groups.ban', {
        group_id: groupId, owner_id: userId, comment_visible: 0
      });
    }
    return callApi('groups.removeUser', { group_id: groupId, user_id: userId });
  }

  function manualAction(action) {
    var g = currentGroupId(), u = $('userId').value.trim();
    var box = $('manualResult');
    if (!g || !u) { box.innerHTML = '<p class="err">Укажите сообщество и пользователя</p>'; return; }
    box.innerHTML = '<p class="muted">Выполняю…</p>';
    moderate(action, g, u)
      .then(function (r) {
        box.innerHTML = '<p class="ok">Готово, ответ VK: ' + JSON.stringify(r) + '</p>';
        log(action + ' ' + u + ' в ' + g + ' — успешно');
      })
      .catch(function (e) {
        var m = describeBridgeError(e);
        box.innerHTML = '<p class="err">' + m + '</p>';
        log(action + ' ' + u + ' — ' + m, 'err');
      });
  }

  $('btnRemove').onclick = function () { manualAction('remove'); };
  $('btnBan').onclick = function () { manualAction('ban'); };

  // --- Шаг 4: сервер ---

  function serverBase() { return $('serverUrl').value.trim().replace(/\/+$/, ''); }
  function serverSecret() { return $('adminSecret').value.trim(); }

  function serverFetch(path, options) {
    var base = serverBase();
    if (!base) return Promise.reject(new Error('не задан адрес сервера'));
    var opts = options || {};
    opts.headers = opts.headers || {};
    opts.headers['Content-Type'] = 'application/json';
    opts.headers['X-Admin-Secret'] = serverSecret();
    return fetch(base + path, opts).then(function (res) {
      return res.json().then(function (body) {
        if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
        return body;
      }, function () { throw new Error('сервер вернул не JSON, HTTP ' + res.status); });
    });
  }

  function pushToken() {
    lsSet('vkmod_server', serverBase());
    lsSet('vkmod_secret', serverSecret());
    if (!token) { $('serverState').innerHTML = '<span class="err">сначала выдайте права</span>'; return; }
    serverFetch('/vk/token', {
      method: 'POST',
      body: JSON.stringify({
        access_token: token,
        expires: Math.floor(tokenExpires / 1000),
        group_id: currentGroupId()
      })
    })
      .then(function (r) {
        var mode = r.server_side_ok
          ? 'сервер может ходить в VK сам'
          : 'сервер в VK не пускают, задания пойдут через это окно';
        $('serverState').innerHTML = '<span class="ok">токен принят</span> — ' + mode;
        log('Токен отправлен на сервер. Прямой доступ с сервера: ' + (r.server_side_ok ? 'да' : 'нет'));
      })
      .catch(function (e) {
        $('serverState').innerHTML = '<span class="err">' + e.message + '</span>';
        log('Отправка токена: ' + e.message, 'err');
      });
  }

  $('btnPush').onclick = pushToken;

  // --- Шаг 5: обработка очереди ---

  function processQueue() {
    var groupId = currentGroupId();
    return serverFetch('/vk/queue?limit=20')
      .then(function (r) {
        var tasks = r.tasks || [];
        if (!tasks.length) return;
        log('Получено заданий: ' + tasks.length);
        // Последовательно и с паузой — VK режет частые вызовы одного токена.
        return tasks.reduce(function (chain, task) {
          return chain.then(function () {
            return moderate(task.action, task.group_id || groupId, task.user_id)
              .then(function () {
                log('✓ ' + task.action + ' ' + task.user_id);
                return { id: task.id, ok: true, error: '' };
              })
              .catch(function (e) {
                var m = describeBridgeError(e);
                log('✗ ' + task.action + ' ' + task.user_id + ' — ' + m, 'err');
                return { id: task.id, ok: false, error: m };
              })
              .then(function (result) {
                return serverFetch('/vk/queue/ack', {
                  method: 'POST', body: JSON.stringify(result)
                }).catch(function (e) { log('ack: ' + e.message, 'err'); });
              })
              .then(function () { return sleep(API_DELAY_MS); });
          });
        }, Promise.resolve());
      })
      .catch(function (e) { log('очередь: ' + e.message, 'err'); });
  }

  function setWorker(on) {
    if (on) {
      workerTimer = setInterval(processQueue, QUEUE_POLL_MS);
      // Токен живёт час — продлеваем молча, диалог согласия VK больше не показывает.
      refreshTimer = setInterval(function () {
        requestToken(true)
          .then(pushToken)
          .catch(function (e) { log('обновление токена: ' + describeBridgeError(e), 'err'); });
      }, TOKEN_REFRESH_MS);
      processQueue();
      $('workerState').innerHTML = '<span class="dot on"></span>работает';
      $('btnWorker').textContent = 'Остановить обработку';
      log('Обработка запущена');
    } else {
      clearInterval(workerTimer); clearInterval(refreshTimer);
      workerTimer = refreshTimer = null;
      $('workerState').innerHTML = '<span class="dot off"></span>остановлена';
      $('btnWorker').textContent = 'Запустить обработку';
      log('Обработка остановлена');
    }
  }

  $('btnWorker').onclick = function () { setWorker(!workerTimer); };

  // --- Старт ---

  $('serverUrl').value = lsGet('vkmod_server');
  $('adminSecret').value = lsGet('vkmod_secret');

  var embedded = !!bridge && (typeof bridge.isEmbedded !== 'function' || bridge.isEmbedded());

  // Строка, по которой сразу видно, что именно не так, если что-то не так.
  $('diag').textContent =
    'vk-bridge: ' + (bridge ? 'загружен' : 'НЕ загружен') +
    ' · внутри VK: ' + (embedded ? 'да' : 'нет') +
    ' · APP_ID: ' + (APP_ID || 'не задан');

  function notInVk() {
    $('authState').innerHTML =
      '<span class="dot bad"></span>страница открыта не внутри VK — откройте ' +
      'vk.com/app' + (APP_ID || '&lt;ID&gt;');
  }

  if (!bridge) {
    fatal('vk-bridge не загрузился: обновите страницу через Ctrl+F5');
    return;
  }
  if (!embedded) {
    notInVk();
    return;
  }

  // Внутри VK мост обычно отвечает мгновенно, но если ответа нет — экран не
  // должен навсегда остаться на «Инициализация».
  var initialized = false;
  var initTimer = setTimeout(function () {
    if (initialized) return;
    initialized = true;
    renderAuth();
    $('authState').innerHTML =
      '<span class="dot off"></span>мост не ответил на VKWebAppInit — ' +
      'попробуйте нажать «Выдать права»';
  }, 4000);

  bridge.send('VKWebAppInit')
    .then(function () {
      if (initialized) return;
      initialized = true;
      clearTimeout(initTimer);
      renderAuth();
      $('authState').innerHTML = APP_ID
        ? '<span class="dot off"></span>готово, выдайте права'
        : '<span class="dot bad"></span>в index.html не заполнен APP_ID';
    })
    .catch(function (e) {
      if (initialized) return;
      initialized = true;
      clearTimeout(initTimer);
      fatal('VKWebAppInit не прошёл: ' + describeBridgeError(e));
    });
})();
</script>
</body>
</html>
